<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Colossus cross-origin embed contract</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #0a0d12; color: #eef2f7; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 24px; }
      main { width: min(1100px, 100%); margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; }
      header { grid-column: 1 / -1; }
      h1 { margin: 0 0 6px; font-size: 24px; }
      p { margin: 0; color: #9ca8b8; }
      code { color: #77b7ff; }
      .frame { min-height: 560px; overflow: hidden; border: 1px solid #293241; border-radius: 12px; background: #10151d; }
      iframe { width: 100%; height: 100%; min-height: 560px; border: 0; }
      aside { padding: 14px; border: 1px solid #293241; border-radius: 12px; background: #131923; }
      aside h2 { margin: 0 0 10px; font-size: 14px; }
      #state { margin-bottom: 12px; color: #f1c66d; font-weight: 700; }
      #events { max-height: 500px; margin: 0; padding: 0; overflow: auto; list-style: none; font: 11px/1.45 ui-monospace, monospace; }
      #events li { padding: 7px 0; overflow-wrap: anywhere; border-top: 1px solid #293241; }
      @media (max-width: 760px) { body { padding: 12px; } main { grid-template-columns: 1fr; } aside { grid-row: 3; } }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Cross-origin embed contract</h1>
        <p>This plain parent records versioned messages from <code>/embed/:mapId</code>. Serve this file on a port different from the viewer.</p>
      </header>
      <div class="frame"><iframe id="map" title="Embedded Colossus map"></iframe></div>
      <aside>
        <h2>Event stream</h2>
        <div id="state">Waiting for ready…</div>
        <ol id="events"></ol>
      </aside>
    </main>
    <script>
      const params = new URLSearchParams(location.search);
      const viewerOrigin = params.get('viewerOrigin') || 'http://127.0.0.1:5173';
      const mapId = params.get('map') || 'mobile-coverage';
      const frame = document.getElementById('map');
      const events = document.getElementById('events');
      const state = document.getElementById('state');
      const viewerUrl = new URL(`/embed/${encodeURIComponent(mapId)}`, viewerOrigin);
      viewerUrl.searchParams.set('theme', 'dark');
      viewerUrl.searchParams.set('lng', params.get('lng') || '10');
      viewerUrl.searchParams.set('lat', params.get('lat') || '50');
      viewerUrl.searchParams.set('z', params.get('z') || '4.8');
      frame.src = viewerUrl;

      window.addEventListener('message', (event) => {
        if (event.origin !== new URL(viewerOrigin).origin || event.source !== frame.contentWindow) return;
        const message = event.data;
        if (!message || message.source !== 'colossus.map-viewer' || message.version !== 1) return;
        const row = document.createElement('li');
        row.textContent = JSON.stringify(message);
        events.prepend(row);
        state.textContent = message.type === 'ready' ? `Ready · contract v${message.version}` : `Last event · ${message.type}`;
      });
    </script>
  </body>
</html>
