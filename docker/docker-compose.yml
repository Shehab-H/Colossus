services:
  mysql:
    image: mysql:8.4
    container_name: colossus-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: colossus-root
      MYSQL_DATABASE: colossus
      MYSQL_USER: colossus
      MYSQL_PASSWORD: colossus
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcolossus-root"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: colossus-clickhouse
    ports:
      - "8123:8123"   # HTTP interface (used by Bake)
      - "9000:9000"   # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    environment:
      CLICKHOUSE_DB: colossus
      CLICKHOUSE_USER: colossus
      CLICKHOUSE_PASSWORD: colossus
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

volumes:
  mysql-data:
  clickhouse-data:
