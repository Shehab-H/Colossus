services:
  mysql:
    image: mysql:8.4
    container_name: colossus-mysql
    restart: unless-stopped
    cpus: "${COLOSSUS_MYSQL_CPUS:-1.0}"
    mem_limit: "${COLOSSUS_MYSQL_MEMORY_LIMIT:-1536m}"
    memswap_limit: "${COLOSSUS_MYSQL_MEMORY_LIMIT:-1536m}"
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: colossus-root
      MYSQL_DATABASE: colossus
      MYSQL_USER: colossus
      MYSQL_PASSWORD: colossus
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pcolossus-root"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: colossus-clickhouse
    cpus: "${COLOSSUS_CLICKHOUSE_CPUS:-2.0}"
    mem_limit: "${COLOSSUS_CLICKHOUSE_MEMORY_LIMIT:-3g}"
    memswap_limit: "${COLOSSUS_CLICKHOUSE_MEMORY_LIMIT:-3g}"
    ports:
      - "8123:8123"   # HTTP interface (used by Bake)
      - "9000:9000"   # native protocol
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/config.d/disable-heavy-system-logs.xml:/etc/clickhouse-server/config.d/disable-heavy-system-logs.xml:ro
    environment:
      CLICKHOUSE_DB: colossus
      CLICKHOUSE_USER: colossus
      CLICKHOUSE_PASSWORD: colossus
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1

  trino-catalog:
    image: postgres:17.2-bookworm
    container_name: colossus-trino-catalog
    cpus: "${COLOSSUS_TRINO_CATALOG_CPUS:-0.5}"
    mem_limit: "${COLOSSUS_TRINO_CATALOG_MEMORY_LIMIT:-512m}"
    memswap_limit: "${COLOSSUS_TRINO_CATALOG_MEMORY_LIMIT:-512m}"
    environment:
      POSTGRES_DB: iceberg
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - trino-catalog-data:/var/lib/postgresql/data
      - ./trino/postgres/init.sql:/docker-entrypoint-initdb.d/001-iceberg.sql:ro

  trino:
    image: trinodb/trino:483
    container_name: colossus-trino
    cpus: "${COLOSSUS_TRINO_CPUS:-2.0}"
    mem_limit: "${COLOSSUS_TRINO_MEMORY_LIMIT:-3g}"
    memswap_limit: "${COLOSSUS_TRINO_MEMORY_LIMIT:-3g}"
    ports:
      - "8080:8080"
    depends_on:
      trino-catalog:
        condition: service_healthy
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/data:/data/colossus-fixtures
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql-data:
  clickhouse-data:
  trino-catalog-data:
