[package]
name = "colossus_datafusion_bench"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
bytes = "1.10"
datafusion = { version = "54.0.0", default-features = false, features = ["parquet", "sql"] }
futures = "0.3"
lance = { version = "10.0.0", default-features = false }
lance-index = { version = "10.0.0", default-features = false }
memmap2 = "0.9"
tokio = { version = "1.47", features = ["rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
